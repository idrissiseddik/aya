<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aya App</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>

body{
    background:#f4f6f9;
    font-family:Arial;
    padding-top:95px;
    padding-bottom:75px;
}

/* 🎨 THEME */
:root{
    --main:#198754;
    --dark:#146c43;
}

/* 🟢 HEADER */
.header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:linear-gradient(135deg,var(--main),var(--dark));
    color:white;
    text-align:center;
    padding:12px 10px;
    z-index:1000;
    box-shadow:0 3px 10px rgba(0,0,0,0.2);
}

.header-title{
    font-size:16px;
    font-weight:bold;
}

.header-sub{
    font-size:12px;
    opacity:0.9;
}

/* 🟢 FOOTER */
.footer{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:linear-gradient(135deg,var(--main),var(--dark));
    color:white;
    text-align:center;
    padding:10px;
    font-size:13px;
    z-index:1000;
    box-shadow:0 -3px 10px rgba(0,0,0,0.2);
}

/* 🧾 CARDS */
.card-box{
    margin:12px;
    background:white;
    padding:15px;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,0.08);
}

/* 💬 COMMENT */
.comment{
    padding:10px;
    border-bottom:1px solid #eee;
}

/* 🔘 ADMIN */
.admin-btn{
    position:fixed;
    bottom:85px;
    right:15px;
    background:#000;
    color:white;
    width:55px;
    height:55px;
    border-radius:50%;
    border:none;
    box-shadow:0 3px 10px rgba(0,0,0,0.3);
}

input, textarea{
    border-radius:10px !important;
}

</style>
</head>

<body>

<!-- 🟢 HEADER -->
<div class="header">
    <div class="header-title">📖 آية كل يوم</div>
    <div class="header-sub">أضف تفسير أو تعليق على الآية الكريمة</div>
</div>

<!-- 📖 AYAH -->
<div class="card-box" id="ayahBox">Chargement...</div>

<!-- ✍️ FORM -->
<div class="card-box">
<input id="name" class="form-control mb-2" placeholder="Nom">
<textarea id="text" class="form-control" placeholder="Écris ton commentaire"></textarea>

<button id="sendBtn" class="btn btn-success w-100 mt-2" onclick="addComment()">
<i class="fa fa-paper-plane"></i> Envoyer
</button>
</div>

<!-- 💬 COMMENTS -->
<div class="card-box" id="comments"></div>

<!-- 🔐 ADMIN -->
<button class="admin-btn" onclick="adminLogin()">
<i class="fa fa-lock"></i>
</button>

<!-- 🟢 FOOTER -->
<div class="footer">
Créé par : M.Seddik EL Idrissi
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyRITNqz1TiJZM1jeFo_IKRIFZkQnwyZkINJgPkRhqomMj8cSHS4xQCY-TwEi3WNQ8TNg/exec";
let isAdmin = false;

/* 📖 AYAH */
async function loadAyah(){
    const res = await fetch("https://api.alquran.cloud/v1/ayah/random");
    const data = await res.json();

    document.getElementById("ayahBox").innerHTML = `
        <h5>${data.data.surah.englishName}</h5>
        <p style="font-size:22px;text-align:right">${data.data.text}</p>
    `;
}

/* 📅 FORMAT DATE */
function formatDate(dateString){
    if(!dateString) return "";

    const d = new Date(dateString);

    const day = String(d.getDate()).padStart(2,"0");
    const month = String(d.getMonth()+1).padStart(2,"0");
    const year = d.getFullYear();

    const hours = String(d.getHours()).padStart(2,"0");
    const minutes = String(d.getMinutes()).padStart(2,"0");

    return `${day}/${month}/${year} ${hours}:${minutes}`;
}

/* 💬 LOAD COMMENTS */
async function loadComments(){

    const res = await fetch(API_URL);
    const data = await res.json();

    let html = "";

    data.forEach(c=>{
        html += `
        <div class="comment">
            <b>${c.name}</b><br>
            ${c.text}<br>
            <small>${formatDate(c.date)}</small>

            <div class="mt-2">
                <button onclick="like(${c.id})" class="btn btn-sm btn-outline-danger">
                    ❤️ ${c.likes || 0}
                </button>

                ${isAdmin ? `<button onclick="del(${c.id})" class="btn btn-sm btn-danger">🗑</button>` : ""}
            </div>
        </div>
        `;
    });

    document.getElementById("comments").innerHTML = html;
}

/* 📤 ADD COMMENT */
async function addComment(){

    const name = document.getElementById("name");
    const text = document.getElementById("text");
    const btn = document.getElementById("sendBtn");

    if(!text.value){
        Swal.fire("Erreur","Écris un commentaire","error");
        return;
    }

    btn.innerHTML = "⏳ Envoi en cours...";
    btn.disabled = true;

    await fetch(API_URL,{
        method:"POST",
        body: JSON.stringify({
            name:name.value,
            text:text.value
        })
    });

    name.value="";
    text.value="";

    btn.innerHTML = '<i class="fa fa-paper-plane"></i> Envoyer';
    btn.disabled = false;

    loadComments();
}

/* ❤️ LIKE */
async function like(id){
    await fetch(API_URL+"?like="+id);
    loadComments();
}

/* 🗑 DELETE */
async function del(id){
    await fetch(API_URL+"?delete="+id);
    loadComments();
}

/* 🔐 ADMIN */
function adminLogin(){
    Swal.fire({
        title:"Admin",
        input:"password",
        showCancelButton:true
    }).then(res=>{
        if(res.value==="Seddik"){
            isAdmin=true;
            Swal.fire("OK","Admin activé","success");
            loadComments();
        } else {
            Swal.fire("Erreur","Mot de passe incorrect","error");
        }
    });
}

/* 🚀 INIT */
loadAyah();
loadComments();

</script>

</body>
</html>
