/* 🎨 THEME */

/* 🟢 HEADER */
.header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:linear-gradient(135deg,var(--main),var(--dark));
    color:white;
    text-align:center;
    padding:12px 10px;
    z-index:1000;
    box-shadow:0 3px 10px rgba(0,0,0,0.2);
}

.header-title{
    font-size:16px;
    font-weight:bold;
}

.header-sub{
    font-size:12px;
    opacity:0.9;
}

/* 🟢 FOOTER */
.footer{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:linear-gradient(135deg,var(--main),var(--dark));
    color:white;
    text-align:center;
    padding:10px;
    font-size:13px;
    z-index:1000;
    box-shadow:0 -3px 10px rgba(0,0,0,0.2);
}

/* 🧾 CARDS */
.card-box{
    margin:12px;
    background:white;
    padding:15px;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,0.08);
}

/* 💬 COMMENT */
.comment{
    padding:10px;
    border-bottom:1px solid #eee;
}

/* 🔘 ADMIN */

    position:fixed;
    bottom:85px;
    right:15px;
    background:#000;

    width:55px;
    height:55px;
    border-radius:50%;
    border:none;
    box-shadow:0 3px 10px rgba(0,0,0,0.3);
}

input, textarea{
    border-radius:10px !important;

.aya-arabic {
    font-size: 24px;
    text-align: right;
    line-height: 1.8;
    margin: 15px 0;
    font-family: 'Traditional Arabic', 'Amiri', 'Scheherazade New', serif;
}

.soura-info {
    text-align: center;
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 2px solid #e0e0e0;
}

.soura-name-ar {
    font-size: 18px;
    font-weight: bold;
    color: var(--main);
    margin: 5px 0;
}

.soura-name-fr {
    font-size: 14px;
    color: #666;
}

.aya-text {
    font-size: 22px;
    text-align: right;
    line-height: 1.8;
    margin: 20px 0;
}

.sadaq-allah {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    color: var(--main);
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px dashed #ddd;
}

<!-- 🟢 HEADER -->
<div class="header">
    <div class="header-title">📖 آية كل يوم</div>
    <div class="header-sub">أضف تفسير أو تعليق على الآية الكريمة</div>
</div>

<!-- 📖 AYAH -->
<div class="card-box" id="ayahBox">Chargement...</div>

<!-- ✍️ FORM -->

<button id="sendBtn" class="btn btn-success w-100 mt-2" onclick="addComment()">
<i class="fa fa-paper-plane"></i> Envoyer

Créé par : M.Seddik EL Idrissi

/* 📖 AYAH avec nom arabe et صدق الله العظيم */
async function loadAyah(){
    try {
        const res = await fetch("https://api.alquran.cloud/v1/ayah/random");
        const data = await res.json();
        
        const sourateNameFr = data.data.surah.englishName;
        const sourateNameAr = sourateNamesAr[sourateNameFr] || data.data.surah.name;
        const ayahNumber = data.data.numberInSurah;
        const ayahText = data.data.text;

        document.getElementById("ayahBox").innerHTML = `
            <div class="soura-info">
                <div class="soura-name-ar">${sourateNameAr}</div>
                <div class="soura-name-fr">${sourateNameFr} - ${ayahNumber}</div>
            </div>
            <div class="aya-text">${ayahText}</div>
            <div class="sadaq-allah">﴿ صدق الله العظيم ﴾</div>
        `;
    } catch(error) {
        document.getElementById("ayahBox").innerHTML = `
            <div class="text-center text-danger">
                Erreur de chargement du verset
            </div>
        `;
    }
}

/* 📅 FORMAT DATE */
function formatDate(dateString){
    if(!dateString) return "";

    const d = new Date(dateString);

    const day = String(d.getDate()).padStart(2,"0");
    const month = String(d.getMonth()+1).padStart(2,"0");
    const year = d.getFullYear();

    const hours = String(d.getHours()).padStart(2,"0");
    const minutes = String(d.getMinutes()).padStart(2,"0");

    return `${day}/${month}/${year} ${hours}:${minutes}`;
}

/* 💬 LOAD COMMENTS */
async function loadComments(){

    try {
        const res = await fetch(API_URL);
        const data = await res.json();

        let html = "";

        if(data.length === 0){
            html = '<div class="text-center text-muted">Aucun commentaire pour le moment</div>';
        } else {
            data.forEach(c=>{
                html += `
                <div class="comment">
                    <b>${escapeHtml(c.name || 'Anonyme')}</b><br>
                    ${escapeHtml(c.text)}<br>
                    <small>${formatDate(c.date)}</small>

                    <div class="mt-2">
                        <button onclick="like(${c.id})" class="btn btn-sm btn-outline-danger">
                            ❤️ ${c.likes || 0}
                        </button>

                        ${isAdmin ? `<button onclick="del(${c.id})" class="btn btn-sm btn-danger ms-2">🗑 Supprimer</button>` : ""}
                    </div>
                </div>
                `;
            });
        }

        document.getElementById("comments").innerHTML = html;
    } catch(error){
        document.getElementById("comments").innerHTML = '<div class="text-danger">Erreur de chargement des commentaires</div>';
    }
}

// Fonction pour échapper les caractères HTML
function escapeHtml(text) {
    if(!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

/* 📤 ADD COMMENT */
async function addComment(){

    const name = document.getElementById("name");
    const text = document.getElementById("text");
    const btn = document.getElementById("sendBtn");

    if(!text.value.trim()){
        Swal.fire("Erreur","Écris un commentaire","error");
        return;
    }

    btn.innerHTML = "⏳ Envoi en cours...";
    btn.disabled = true;

    try {
        await fetch(API_URL,{
            method:"POST",
            body: JSON.stringify({
                name: name.value.trim() || "Anonyme",
                text: text.value.trim()
            })
        });

        name.value = "";
        text.value = "";

        Swal.fire("Succès","Commentaire ajouté avec succès","success");
        await loadComments();
    } catch(error) {
        Swal.fire("Erreur","Erreur lors de l'envoi du commentaire","error");
    } finally {
        btn.innerHTML = '<i class="fa fa-paper-plane"></i> Envoyer';
        btn.disabled = false;
    }
}

/* ❤️ LIKE */
async function like(id){
    try {
        await fetch(API_URL+"?like="+id);
        await loadComments();
    } catch(error) {
        Swal.fire("Erreur","Erreur lors du like","error");
    }
}

/* 🗑 DELETE */
async function del(id){
    const confirm = await Swal.fire({
        title: "Confirmation",
        text: "Voulez-vous vraiment supprimer ce commentaire ?",
        icon: "warning",
        showCancelButton: true
    });
    
    if(confirm.isConfirmed) {
        try {
            await fetch(API_URL+"?delete="+id);
            await loadComments();
            Swal.fire("Supprimé","Commentaire supprimé avec succès","success");
        } catch(error) {
            Swal.fire("Erreur","Erreur lors de la suppression","error");
        }
    }
}

/* 🔐 ADMIN */
function adminLogin(){
    Swal.fire({
        title:"Mode Admin",
        text:"Entrez le mot de passe administrateur",
        input:"password",
        showCancelButton:true,
        confirmButtonText:"Valider",
        cancelButtonText:"Annuler"
    }).then(res=>{
        if(res.value==="Seddik"){
            isAdmin=true;
            Swal.fire("Succès","Mode admin activé !","success");
            loadComments();
        } else if(res.value) {
            Swal.fire("Erreur","Mot de passe incorrect","error");
        }
    });
}
