}

.admin-header-btn {

/* ========== MODALE DE BIENVENUE ANIMÉE ========== */
.modal-welcome {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(3px);
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 1;
    transition: opacity 0.4s ease;
}

.modal-welcome.fade-out {
    opacity: 0;
    pointer-events: none;
}

.modal-welcome.fade-out .modal-content-welcome {
    transform: translateY(30px) scale(0.95);
    opacity: 0;
}

.modal-content-welcome {
    background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
    border-radius: 24px;
    padding: 48px 40px;
    max-width: 480px;
    width: 90%;
    text-align: center;
    box-shadow: 0 40px 60px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(25, 135, 84, 0.2);
    transform: translateY(0) scale(1);
    transition: all 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
    animation: modalSlideUp 0.5s ease-out;
}

@keyframes modalSlideUp {
    0% {
        transform: translateY(60px) scale(0.9);
        opacity: 0;
    }
    100% {
        transform: translateY(0) scale(1);
        opacity: 1;
    }
}

.modal-welcome.fade-out .modal-content-welcome {
    animation: modalSlideDown 0.3s ease forwards;
}

@keyframes modalSlideDown {
    0% {
        transform: translateY(0) scale(1);
        opacity: 1;
    }
    100% {
        transform: translateY(40px) scale(0.95);
        opacity: 0;
    }
}

.modal-title-welcome {
    font-size: 34px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--main), var(--dark));
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    margin-bottom: 20px;
    letter-spacing: -0.5px;
}

.modal-divider {
    width: 80px;
    height: 3px;
    background: linear-gradient(90deg, var(--main), var(--dark));
    margin: 0 auto 25px auto;
    border-radius: 3px;

.modal-text-welcome {

.modal-btn-welcome {

const API_URL = "https://script.google.com/macros/s/AKfycbwYqSArgABESHI_AbUhldrxUnnQ6Vcfl5kZORSYj5GEroNVeRYhLg6mmMGkpLsNYEB9PA/exec";
let isAdmin = false;

// 🎉 MODALE DE BIENVENUE ANIMÉE - AFFICHAGE UNIQUE AU CHARGEMENT
function showWelcomeModal() {
    const modal = document.getElementById('welcomeModal');
    modal.classList.remove('fade-out');
    modal.style.display = 'flex';
}

function closeWelcomeModal() {
    const modal = document.getElementById('welcomeModal');
    modal.classList.add('fade-out');
    // Attendre la fin de l'animation pour masquer complètement
    setTimeout(() => {
        modal.style.display = 'none';

}

// 📅 Obtenir la date du jour
function getTodayKey() {
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
}

// 🔑 Générer un nombre aléatoire basé sur la date (identique pour tous)
function getDailyNumber(max, seed) {
    let hash = 0;
    for (let i = 0; i < seed.length; i++) {
        hash = ((hash << 5) - hash) + seed.charCodeAt(i);
        hash = hash & hash;
    }
    const random = Math.abs(Math.sin(hash) * 10000) % max;
    return Math.floor(random) + 1;
}

// Convertir date en format YYYY-MM-DD
function convertToDateKey(dateValue) {
    if (!dateValue) return null;
    try {
        if (typeof dateValue === 'string' && dateValue.includes('/')) {
            const parts = dateValue.split(' ');
            const dateParts = parts[0].split('/');
            if (dateParts.length === 3) {
                return `${dateParts[2]}-${dateParts[1].padStart(2,'0')}-${dateParts[0].padStart(2,'0')}`;
            }
        }
        let date = new Date(dateValue);
        if (isNaN(date.getTime())) return null;
        return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    } catch(e) {
        return null;
    }
}

// 📢 Afficher notification

    toast.innerHTML = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

document.getElementById('todayBadge').innerHTML = getTodayKey();

// 📚 Noms des sourates en arabe (COMPLET)

/* 📖 CHARGER AYA */
async function loadAyah() {
    try {
        const todayKey = getTodayKey();
        
        let ayah = localStorage.getItem(`ayah_fixed_${todayKey}`);
        
        if (ayah) {
            displayAyah(JSON.parse(ayah));
            return;
        }
        
        const sourateNumber = getDailyNumber(114, todayKey);
        const versetNumber = getDailyNumber(10, todayKey + "verse");
        
        const res = await fetch(`https://api.alquran.cloud/v1/ayah/${sourateNumber}:${versetNumber}`);
        const data = await res.json();
        
        if (data.data) {
            ayah = {
                sourateNameFr: data.data.surah.englishName,
                sourateNameAr: sourateNamesAr[data.data.surah.englishName] || data.data.surah.name,
                ayahNumber: data.data.numberInSurah,
                ayahText: data.data.text
            };
        } else {
            const fallbackRes = await fetch("https://api.alquran.cloud/v1/ayah/random");
            const fallbackData = await fallbackRes.json();
            ayah = {
                sourateNameFr: fallbackData.data.surah.englishName,
                sourateNameAr: sourateNamesAr[fallbackData.data.surah.englishName] || fallbackData.data.surah.name,
                ayahNumber: fallbackData.data.numberInSurah,
                ayahText: fallbackData.data.text
            };
        }
        
        localStorage.setItem(`ayah_fixed_${todayKey}`, JSON.stringify(ayah));
        displayAyah(ayah);
        
    } catch(error) {
        console.error("Erreur chargement aya:", error);
        try {
            const res = await fetch("https://api.alquran.cloud/v1/ayah/random");
            const data = await res.json();
            const ayah = {
                sourateNameFr: data.data.surah.englishName,
                sourateNameAr: sourateNamesAr[data.data.surah.englishName] || data.data.surah.name,
                ayahNumber: data.data.numberInSurah,
                ayahText: data.data.text
            };
            displayAyah(ayah);
        } catch(e) {
            document.getElementById("ayahBox").innerHTML = `<div class="text-center text-danger">خطأ في تحميل الآية</div>`;
        }
    }
}

function displayAyah(ayah) {
    document.getElementById("ayahBox").innerHTML = `
        <div class="soura-info">
            <div class="soura-name-ar">${ayah.sourateNameAr}</div>
            <div class="soura-name-fr">${ayah.sourateNameFr} - ${ayah.ayahNumber}</div>
        </div>
        <div class="aya-text">${ayah.ayahText}</div>
        <div class="sadaq-allah">﴿ صدق الله العظيم ﴾</div>
        <div class="date-info">📅 ${new Date().toLocaleDateString('ar-EG')}</div>
    `;
}

/* ❤️ LIKE */
async function likeComment(commentId, buttonElement) {
    if (commentId === undefined || commentId === null) {
        showNotification("❌ معرف التعليق مفقود", true);
        return;
    }
    
    const likeSpan = buttonElement.querySelector('.like-count');
    const currentLikes = likeSpan ? parseInt(likeSpan.textContent) : 0;
    
    if (likeSpan) {
        likeSpan.textContent = currentLikes + 1;
    }
    
    buttonElement.disabled = true;
    buttonElement.style.opacity = '0.6';
    
    try {
        const response = await fetch(`${API_URL}?action=like&id=${commentId}`);
        const result = await response.json();
        
        if (result.success) {
            if (likeSpan) {
                likeSpan.textContent = result.likes;
            }
            showNotification("❤️ تمت الإضافة!");
        } else {
            if (likeSpan) {
                likeSpan.textContent = currentLikes;
            }
            showNotification("❌ " + (result.error || "خطأ"), true);
        }
        
    } catch(error) {
        console.error("Erreur like:", error);
        if (likeSpan) {
            likeSpan.textContent = currentLikes;
        }
        showNotification("❌ خطأ في الاتصال", true);
    } finally {
        buttonElement.disabled = false;
        buttonElement.style.opacity = '1';
    }
}

/* 🗑 DELETE */
async function deleteComment(commentId, buttonElement) {
    if (!isAdmin) {
        showNotification("❌ وضع المشرف غير مفعل", true);
        return;
    }
    
    const confirm = await Swal.fire({
        title: '🗑 حذف التعليق',
        text: 'هل أنت متأكد من حذف هذا التعليق؟',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#198754',
        confirmButtonText: 'نعم، احذف',
        cancelButtonText: 'إلغاء'
    });
    
    if (!confirm.isConfirmed) return;
    
    if (buttonElement) {
        buttonElement.disabled = true;
        buttonElement.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    }
    
    try {
        const response = await fetch(`${API_URL}?action=delete&id=${commentId}`);
        const result = await response.json();
        
        if (result.success) {
            showNotification("✅ تم حذف التعليق!");
            setTimeout(() => loadComments(true), 500);
        } else {
            showNotification("❌ " + (result.error || "خطأ أثناء الحذف"), true);
        }
        
    } catch(error) {
        console.error("Erreur suppression:", error);
        showNotification("❌ خطأ في الاتصال", true);
    } finally {
        if (buttonElement) {
            buttonElement.disabled = false;
            buttonElement.innerHTML = '🗑 حذف';
        }
    }
}

/* 💬 LOAD COMMENTS */
async function loadComments(showRefreshMessage = false) {
    if (isLoading) return;
    isLoading = true;
    
    try {
        const todayKey = getTodayKey();
        
        const refreshBtn = document.querySelector('.refresh-btn i');
        if (refreshBtn) refreshBtn.classList.add('fa-spin');
        
        const response = await fetch(API_URL);
        const allComments = await response.json();
        
        if (allComments.error) {
            throw new Error(allComments.error);
        }
        
        const todayComments = allComments.filter(comment => {
            const convertedDate = convertToDateKey(comment.dayKey);
            return convertedDate === todayKey;
        });
        
        document.getElementById('commentCount').innerHTML = `(${todayComments.length})`;
        
        if (todayComments.length === 0) {
            document.getElementById("comments").innerHTML = `
                <div class="text-center text-muted py-4">
                    <i class="fas fa-comment-dots fa-2x mb-2"></i>
                    <p>لا توجد تعليقات لهذا اليوم</p>
                    <small>كن أول من يعلق!</small>
                </div>
            `;
            if (showRefreshMessage) showNotification("📭 لا توجد تعليقات");
            return;
        }
        
        let html = "";
        todayComments.forEach((comment) => {
            const name = escapeHtml(comment.name || "مجهول");
            const text = escapeHtml(comment.text || "");
            const date = comment.date || "";
            const likes = comment.likes || 0;
            const commentId = comment.id;
            
            html += `
                <div class="comment" data-id="${commentId}">
                    <div class="comment-header">
                        <span class="comment-name">
                            <i class="fas fa-user-circle"></i> ${name}
                        </span>
                        <span class="comment-date">${date}</span>
                    </div>
                    <div class="comment-text">
                        ${text}
                    </div>
                    <div>
                        <button class="btn-like" onclick="likeComment(${commentId}, this)">
                            ❤️ <span class="like-count">${likes}</span>
                        </button>
                        ${isAdmin ? `<button class="btn-delete" onclick="deleteComment(${commentId}, this)">
                            🗑 حذف
                        </button>` : ''}
                    </div>
                </div>
            `;
        });
        
        document.getElementById("comments").innerHTML = html;
        if (showRefreshMessage) showNotification(`✅ ${todayComments.length} تعليق(ات)`);
        
    } catch(error) {
        console.error("Erreur:", error);
        document.getElementById("comments").innerHTML = `
            <div class="text-center text-danger">
                <p>⚠️ خطأ في الاتصال</p>
                <button class="btn btn-sm btn-success" onclick="loadComments(true)">🔄 إعادة المحاولة</button>
            </div>
        `;
        if (showRefreshMessage) showNotification("❌ خطأ في الاتصال", true);
    } finally {
        isLoading = false;
        const refreshBtn = document.querySelector('.refresh-btn i');
        if (refreshBtn) refreshBtn.classList.remove('fa-spin');
    }
}

/* 📤 ADD COMMENT */
async function addComment() {
    const nameInput = document.getElementById("name");
    const textInput = document.getElementById("text");
    const btn = document.getElementById("sendBtn");
    const todayKey = getTodayKey();

    if (!textInput.value.trim()) {
        Swal.fire("خطأ", "اكتب تعليقاً", "error");
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإرسال...';

    try {
        const commentData = {
            name: nameInput.value.trim() || "مجهول",
            text: textInput.value.trim(),
            dayKey: todayKey
        };
        
        await fetch(API_URL, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify(commentData)
        });

        nameInput.value = "";
        textInput.value = "";
        
        Swal.fire({
            icon: 'success',
            title: '✅ تم إضافة التعليق!',
            timer: 1500,
            showConfirmButton: false
        });
        
        setTimeout(() => loadComments(true), 1000);
        
    } catch(error) {
        console.error("Erreur:", error);
        Swal.fire({
            icon: 'success',
            title: 'تم إرسال التعليق',
            timer: 1500,
            showConfirmButton: false
        });
        nameInput.value = "";
        textInput.value = "";
        setTimeout(() => loadComments(true), 1000);
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa fa-paper-plane"></i> إرسال التعليق';
    }
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

/* 🔐 ADMIN LOGIN */
function adminLogin() {
    Swal.fire({
        title: "🔐 وضع المشرف",
        text: "أدخل كلمة المرور",
        input: "password",
        inputPlaceholder: "كلمة المرور",
        showCancelButton: true,
        confirmButtonText: "تأكيد",
        cancelButtonText: "إلغاء"
    }).then(res => {
        if (res.value === "Seddik") {
            isAdmin = true;
            document.getElementById('adminBadge').style.display = 'inline-block';
            Swal.fire({
                icon: 'success',
                title: '✅ تم تفعيل وضع المشرف!',
                text: 'يمكنك الآن حذف التعليقات',
                timer: 2000,
                showConfirmButton: false
            });
            loadComments(true);
        } else if (res.value) {
            Swal.fire({
                icon: 'error',
                title: '❌ خطأ',
                text: 'كلمة المرور غير صحيحة',
                confirmButtonColor: '#198754'
            });
        }
    });
}
