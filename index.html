<style>
body{
    background:#f4f6f9;
    font-family:'Segoe UI', Arial;
    padding-top:95px;
    padding-bottom:75px;
}

:root{
    --main:#198754;
    --dark:#146c43;
}

.header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:linear-gradient(135deg,var(--main),var(--dark));
    color:white;
    text-align:center;
    padding:12px 10px;
    z-index:1000;
    box-shadow:0 3px 10px rgba(0,0,0,0.2);
}

.header-title{
    font-size:18px;
    font-weight:bold;
}

.header-sub{
    font-size:12px;
    opacity:0.9;
}

.footer{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:linear-gradient(135deg,var(--main),var(--dark));
    color:white;
    text-align:center;
    padding:10px;
    font-size:12px;
    z-index:1000;
    box-shadow:0 -3px 10px rgba(0,0,0,0.2);
}

.card-box{
    margin:12px;
    background:white;
    padding:15px;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,0.08);
}

.comment{
    padding:12px;
    border-bottom:1px solid #eee;
    transition: background 0.2s;
}

.comment:hover{
    background: #f9f9f9;
}

.comment:last-child{
    border-bottom:none;
}

.admin-btn{
    position:fixed;
    bottom:85px;
    right:15px;
    background:#000;
    color:white;
    width:55px;
    height:55px;
    border-radius:50%;
    border:none;
    box-shadow:0 3px 10px rgba(0,0,0,0.3);
    transition: transform 0.2s;
    z-index:1000;
    cursor:pointer;
}

.admin-btn:hover{
    transform: scale(1.05);
}

input, textarea{
    border-radius:10px !important;
}

.soura-info {
    text-align: center;
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 2px solid #e0e0e0;
}

.soura-name-ar {
    font-size: 20px;
    font-weight: bold;
    color: var(--main);
    margin: 5px 0;
}

.soura-name-fr {
    font-size: 14px;
    color: #666;
}

.aya-text {
    font-size: 24px;
    text-align: right;
    line-height: 1.8;
    margin: 20px 0;
    font-family: 'Traditional Arabic', 'Amiri', 'Scheherazade New', serif;
}

.sadaq-allah {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    color: var(--main);
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px dashed #ddd;
}

.date-info {
    text-align: center;
    font-size: 12px;
    color: #888;
    margin-top: 10px;
}

.loading-spinner {
    text-align: center;
    padding: 20px;
}

.comment-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    flex-wrap: wrap;
}

.comment-name {
    font-weight: bold;
    color: var(--main);
}

.comment-name i {
    margin-right: 5px;
}

.comment-date {
    font-size: 11px;
    color: #999;
}

.comment-text {
    margin: 10px 0;
    line-height: 1.5;
    color: #333;
}

.btn-like {
    background: none;
    border: 1px solid #dc3545;
    color: #dc3545;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    transition: all 0.2s;
    cursor: pointer;
}

.btn-like:hover:not(:disabled) {
    background: #dc3545;
    color: white;
    transform: scale(1.05);
}

.btn-like:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.btn-delete {
    background: none;
    border: 1px solid #dc3545;
    color: #dc3545;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    margin-left: 8px;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-delete:hover {
    background: #dc3545;
    color: white;
    transform: scale(1.05);
}

.today-badge {
    background: var(--main);
    color: white;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 11px;
    margin-left: 8px;
}

.refresh-btn {
    background: none;
    border: none;
    color: var(--main);
    cursor: pointer;
    padding: 5px;
    transition: transform 0.3s;
}

.refresh-btn:hover {
    transform: rotate(180deg);
}

.comment-count {
    font-size: 12px;
    color: #666;
    margin-left: 8px;
}

.toast-notification {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    color: white;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 12px;
    z-index: 999;
    animation: fadeOut 3s forwards;
}

@keyframes fadeOut {
    0% { opacity: 1; }
    70% { opacity: 1; }
    100% { opacity: 0; visibility: hidden; }
}

.admin-badge {
    background: #ffc107;
    color: #000;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 10px;
    margin-left: 10px;

// 📅 Obtenir la date du jour
function getTodayKey() {
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
}

// Convertir date en format YYYY-MM-DD
function convertToDateKey(dateValue) {
    if (!dateValue) return null;
    try {
        if (typeof dateValue === 'string' && dateValue.includes('/')) {
            const parts = dateValue.split(' ');
            const dateParts = parts[0].split('/');
            if (dateParts.length === 3) {
                return `${dateParts[2]}-${dateParts[1].padStart(2,'0')}-${dateParts[0].padStart(2,'0')}`;
            }
        }
        let date = new Date(dateValue);
        if (isNaN(date.getTime())) return null;
        return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    } catch(e) {
        return null;
    }
}

// 📢 Afficher notification

    const toast = document.createElement('div');
    toast.className = 'toast-notification';
    toast.style.background = isError ? 'rgba(220, 53, 69, 0.9)' : 'rgba(25, 135, 84, 0.9)';
    toast.innerHTML = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

/* 📖 CHARGER AYA DU JOUR */
async function loadAyah() {
    try {
        const todayKey = getTodayKey();
        const cachedAyah = localStorage.getItem(`ayah_${todayKey}`);
        
        if (cachedAyah) {
            displayAyah(JSON.parse(cachedAyah));
            return;
        }
        
        const res = await fetch("https://api.alquran.cloud/v1/ayah/random");
        const data = await res.json();
        
        const ayah = {
            sourateNameFr: data.data.surah.englishName,
            sourateNameAr: sourateNamesAr[data.data.surah.englishName] || data.data.surah.name,
            ayahNumber: data.data.numberInSurah,
            ayahText: data.data.text
        };
        
        localStorage.setItem(`ayah_${todayKey}`, JSON.stringify(ayah));
        displayAyah(ayah);
        
    } catch(error) {
        console.error(error);
        document.getElementById("ayahBox").innerHTML = `<div class="text-center text-danger">Erreur de chargement du verset</div>`;
    }
}

function displayAyah(ayah) {
    document.getElementById("ayahBox").innerHTML = `
        <div class="soura-info">
            <div class="soura-name-ar">${ayah.sourateNameAr}</div>
            <div class="soura-name-fr">${ayah.sourateNameFr} - ${ayah.ayahNumber}</div>
        </div>
        <div class="aya-text">${ayah.ayahText}</div>
        <div class="sadaq-allah">﴿ صدق الله العظيم ﴾</div>
        <div class="date-info">📅 ${new Date().toLocaleDateString('fr-FR')}</div>
    `;
}

/* ❤️ FONCTION LIKE */
async function likeComment(commentId, buttonElement) {
    if (commentId === undefined || commentId === null) {
        showNotification("❌ ID du commentaire manquant", true);
        return;
    }
    
    const likeSpan = buttonElement.querySelector('.like-count');
    const currentLikes = likeSpan ? parseInt(likeSpan.textContent) : 0;
    
    // Mise à jour optimiste
    if (likeSpan) {
        likeSpan.textContent = currentLikes + 1;
    }
    
    buttonElement.disabled = true;
    buttonElement.style.opacity = '0.6';
    
    try {
        const response = await fetch(`${API_URL}?action=like&id=${commentId}`);
        const result = await response.json();
        
        if (result.success) {
            if (likeSpan) {
                likeSpan.textContent = result.likes;
            }
            showNotification("❤️ Like ajouté !");
        } else {
            if (likeSpan) {
                likeSpan.textContent = currentLikes;
            }
            showNotification("❌ " + (result.error || "Erreur"), true);
        }
        
    } catch(error) {
        console.error("Erreur like:", error);
        if (likeSpan) {
            likeSpan.textContent = currentLikes;
        }
        showNotification("❌ Erreur de connexion", true);
    } finally {
        buttonElement.disabled = false;
        buttonElement.style.opacity = '1';
    }
}

/* 🗑 FONCTION SUPPRESSION */
async function deleteComment(commentId, buttonElement) {
    if (!isAdmin) {
        showNotification("❌ Mode admin non activé", true);
        return;
    }
    
    const confirm = await Swal.fire({
        title: '🗑 Supprimer le commentaire',
        text: 'Êtes-vous sûr de vouloir supprimer ce commentaire ?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#198754',
        confirmButtonText: 'Oui, supprimer',
        cancelButtonText: 'Annuler'
    });
    
    if (!confirm.isConfirmed) return;
    
    if (buttonElement) {
        buttonElement.disabled = true;
        buttonElement.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    }
    
    try {
        const response = await fetch(`${API_URL}?action=delete&id=${commentId}`);
        const result = await response.json();
        
        if (result.success) {
            showNotification("✅ Commentaire supprimé !");
            setTimeout(() => loadComments(true), 500);
        } else {
            showNotification("❌ " + (result.error || "Erreur lors de la suppression"), true);
        }
        
    } catch(error) {
        console.error("Erreur suppression:", error);
        showNotification("❌ Erreur de connexion", true);
    } finally {
        if (buttonElement) {
            buttonElement.disabled = false;
            buttonElement.innerHTML = '🗑 Supprimer';
        }
    }
}

/* 💬 CHARGER COMMENTAIRES */
async function loadComments(showRefreshMessage = false) {
    if (isLoading) return;
    isLoading = true;
    
    try {
        const todayKey = getTodayKey();
        
        const refreshBtn = document.querySelector('.refresh-btn i');
        if (refreshBtn) refreshBtn.classList.add('fa-spin');
        
        const response = await fetch(API_URL);
        const allComments = await response.json();
        
        if (allComments.error) {
            throw new Error(allComments.error);
        }
        
        // Filtrer les commentaires du jour
        const todayComments = allComments.filter(comment => {
            const convertedDate = convertToDateKey(comment.dayKey);
            return convertedDate === todayKey;
        });
        
        document.getElementById('commentCount').innerHTML = `(${todayComments.length})`;
        
        if (todayComments.length === 0) {
            document.getElementById("comments").innerHTML = `
                <div class="text-center text-muted py-4">
                    <i class="fas fa-comment-dots fa-2x mb-2"></i>
                    <p>Aucun commentaire pour aujourd'hui</p>
                    <small>Soyez le premier à commenter !</small>
                </div>
            `;
            if (showRefreshMessage) showNotification("📭 Aucun commentaire");
            return;
        }
        
        let html = "";
        todayComments.forEach((comment) => {
            const name = escapeHtml(comment.name || "Anonyme");
            const text = escapeHtml(comment.text || "");
            const date = comment.date || "";
            const likes = comment.likes || 0;
            const commentId = comment.id;
            
            html += `
                <div class="comment" data-id="${commentId}">
                    <div class="comment-header">
                        <span class="comment-name">
                            <i class="fas fa-user-circle"></i> ${name}
                        </span>
                        <span class="comment-date">${date}</span>
                    </div>
                    <div class="comment-text">
                        ${text}
                    </div>
                    <div>
                        <button class="btn-like" onclick="likeComment(${commentId}, this)">
                            ❤️ <span class="like-count">${likes}</span>
                        </button>
                        ${isAdmin ? `<button class="btn-delete" onclick="deleteComment(${commentId}, this)">
                            🗑 Supprimer
                        </button>` : ''}
                    </div>
                </div>
            `;
        });
        
        document.getElementById("comments").innerHTML = html;
        if (showRefreshMessage) showNotification(`✅ ${todayComments.length} commentaire(s)`);
        
    } catch(error) {
        console.error("Erreur:", error);
        document.getElementById("comments").innerHTML = `
            <div class="text-center text-danger">
                <p>⚠️ Erreur de connexion</p>
                <button class="btn btn-sm btn-success" onclick="loadComments(true)">🔄 Réessayer</button>
            </div>
        `;
        if (showRefreshMessage) showNotification("❌ Erreur de connexion", true);
    } finally {
        isLoading = false;
        const refreshBtn = document.querySelector('.refresh-btn i');
        if (refreshBtn) refreshBtn.classList.remove('fa-spin');
    }
}

/* 📤 AJOUTER COMMENTAIRE */
async function addComment() {
    const nameInput = document.getElementById("name");
    const textInput = document.getElementById("text");
    const btn = document.getElementById("sendBtn");
    const todayKey = getTodayKey();

    if (!textInput.value.trim()) {
        Swal.fire("Erreur", "Écris un commentaire", "error");
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Envoi...';

    try {
        const commentData = {
            name: nameInput.value.trim() || "Anonyme",
            text: textInput.value.trim(),
            dayKey: todayKey
        };
        
        await fetch(API_URL, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify(commentData)
        });

        nameInput.value = "";
        textInput.value = "";
        
        Swal.fire({
            icon: 'success',
            title: '✅ Commentaire ajouté !',
            timer: 1500,
            showConfirmButton: false
        });
        
        setTimeout(() => loadComments(true), 1000);
        
    } catch(error) {
        console.error("Erreur:", error);
        Swal.fire({
            icon: 'success',
            title: 'Commentaire envoyé',
            timer: 1500,
            showConfirmButton: false
        });
        nameInput.value = "";
        textInput.value = "";
        setTimeout(() => loadComments(true), 1000);
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa fa-paper-plane"></i> Envoyer';
    }
}

// Échapper les caractères HTML
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

/* 🔐 ADMIN LOGIN */
function adminLogin() {
    Swal.fire({
        title: "🔐 Mode Administrateur",
        text: "Entrez le mot de passe",
        input: "password",
        inputPlaceholder: "Mot de passe",
        showCancelButton: true,
        confirmButtonText: "Valider",
        cancelButtonText: "Annuler"
    }).then(res => {
        if (res.value === "Seddik") {
            isAdmin = true;
            document.getElementById('adminBadge').style.display = 'inline-block';
            Swal.fire({
                icon: 'success',
                title: '✅ Mode admin activé !',
                text: 'Vous pouvez maintenant supprimer les commentaires',
                timer: 2000,
                showConfirmButton: false
            });
            loadComments(true);
        } else if (res.value) {
            Swal.fire({
                icon: 'error',
                title: '❌ Erreur',
                text: 'Mot de passe incorrect',
                confirmButtonColor: '#198754'
            });
        }
    });
}

loadAyah();
loadComments(false);

// Rafraîchissement automatique toutes les 30 secondes
setInterval(() => {
    loadComments(false);
}, 30000);
